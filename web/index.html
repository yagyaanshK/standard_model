<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Atlas | Standard Model Explorer</title>
    <script>
        (() => {
            try {
                const stored = localStorage.getItem("particle-atlas-theme");
                const systemTheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                document.documentElement.dataset.theme = stored || systemTheme;
            } catch {
                document.documentElement.dataset.theme = "dark";
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css?v=7">
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.170.0",
            "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <header id="app-brand">
        <strong>Particle Atlas</strong>
        <span>Standard Model explorer</span>
        <button id="theme-toggle" type="button" role="switch" aria-label="Use light theme" aria-checked="false" title="Use light theme">
            &#9680;
        </button>
    </header>

    <div id="particle-search" role="search">
        <input id="particle-search-input" type="search" placeholder="Find a particle" autocomplete="off" role="combobox" aria-label="Find a particle" aria-autocomplete="list" aria-expanded="false" aria-controls="particle-search-results">
        <button id="particle-search-clear" type="button" aria-label="Clear particle search" title="Clear search" hidden>&times;</button>
        <ul id="particle-search-results" role="listbox"></ul>
    </div>

    <div id="mode-switcher"></div>

    <button id="controls-toggle" aria-label="Toggle controls" aria-expanded="false">&#9776;</button>
    <div id="controls">
        <h2>Standard Model 3D</h2>
    </div>

    <div id="tooltip"></div>

    <div id="zoomed-info">
        <button id="close-zoom" aria-label="Close zoom overlay">&times;</button>
        <div id="zoomed-content"></div>
    </div>

    <aside id="agent-panel" aria-live="polite">
        <div class="agent-panel-header">
            <span>Agent activity</span>
            <span id="webmcp-status" class="unavailable">Checking WebMCP</span>
        </div>
        <ol id="agent-activity">
            <li class="empty">No agent actions yet</li>
        </ol>
    </aside>

    <script type="module" src="js/main.js?v=7"></script>
</body>
</html>
